<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard - Settings Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card {
            @apply bg-white rounded-lg shadow-md p-6 mb-4;
        }
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #000;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 9999;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Debug Console -->
    <div id="debugConsole" class="debug-info">
        <div>🔍 Debug Console</div>
        <div id="debugLog">Starting...</div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Moomoo Trading Dashboard (Debug)</h1>
            <div class="flex space-x-4">
                <!-- This is the problematic settings button -->
                <button id="settingsBtn"
                        onclick="debugLog('Settings clicked via onclick!'); showModal();"
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    ⚙️ Settings
                </button>

                <!-- Alternative test button -->
                <button id="testModalBtn"
                        onclick="debugLog('Test button clicked!'); document.getElementById('settingsModal').classList.remove('hidden');"
                        class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    🧪 Direct Test
                </button>

                <button id="logoutBtn" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    Logout
                </button>
            </div>
        </div>

        <div class="card">
            <h2>Debug Information</h2>
            <p>Click the Settings button or Direct Test button to test the modal.</p>
            <p>Watch the debug console in the top right for real-time information.</p>
        </div>

        <!-- Moomoo Credentials Settings Modal -->
        <div id="settingsModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
            <div class="flex justify-center items-center h-full">
                <div class="bg-white rounded-lg shadow-lg w-full max-w-md mx-4">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-semibold text-gray-800">⚙️ Moomoo Connection Settings</h3>
                            <button id="closeSettingsBtn"
                                    onclick="debugLog('Close clicked!'); document.getElementById('settingsModal').classList.add('hidden');"
                                    class="text-gray-400 hover:text-gray-600">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="p-6">
                        <form id="credentialsForm" onsubmit="return handleSubmit(event);">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Moomoo Host</label>
                                <input type="text" id="moomooHost" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="127.0.0.1" placeholder="127.0.0.1">
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Moomoo Port</label>
                                <input type="number" id="moomooPort" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="11111" placeholder="11111">
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Security Firm</label>
                                <select id="securityFirm" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="FUTUSG">FUTU SG</option>
                                    <option value="FUTUHK">FUTU HK</option>
                                    <option value="FUTUUS">FUTU US</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Trade Market</label>
                                <select id="tradeMarket" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="US">US Market</option>
                                    <option value="HK">HK Market</option>
                                    <option value="SG">SG Market</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Moomoo Username</label>
                                <input type="text" id="moomooUsername" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="102872417" value="102872417">
                            </div>

                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Moomoo Password</label>
                                <input type="password" id="moomooPassword" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="L850901c" value="L850901c">
                            </div>

                            <div class="flex justify-end space-x-3">
                                <button type="button"
                                        onclick="debugLog('Cancel clicked!'); document.getElementById('settingsModal').classList.add('hidden');"
                                        class="px-4 py-2 text-gray-600 bg-gray-200 rounded hover:bg-gray-300 focus:outline-none">
                                    Cancel
                                </button>
                                <button type="submit" id="saveCredentialsBtn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none">
                                    Save Configuration
                                </button>
                            </div>
                        </form>

                        <!-- Status Messages -->
                        <div id="credentialsStatus" class="mt-4 hidden">
                            <div id="credentialsSuccess" class="hidden bg-green-100 border border-green-400 text-green-700 px-3 py-2 rounded mb-2">
                                ✅ <span id="successMessage"></span>
                            </div>
                            <div id="credentialsError" class="hidden bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded mb-2">
                                ❌ <span id="errorMessage"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Debug logging function
        function debugLog(message) {
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<br>${time}: ${message}`;
            console.log(`DEBUG: ${message}`);
        }

        // Direct modal show function
        function showModal() {
            debugLog('showModal() called');
            const modal = document.getElementById('settingsModal');
            if (modal) {
                modal.classList.remove('hidden');
                debugLog('Modal classes after show: ' + modal.className);
            } else {
                debugLog('ERROR: Modal element not found!');
            }
        }

        // Handle form submission
        function handleSubmit(event) {
            event.preventDefault();
            debugLog('Form submitted!');

            const formData = {
                moomoo_host: document.getElementById('moomooHost').value,
                moomoo_port: parseInt(document.getElementById('moomooPort').value),
                security_firm: document.getElementById('securityFirm').value,
                trade_market: document.getElementById('tradeMarket').value,
                moomoo_username: document.getElementById('moomooUsername').value,
                moomoo_password: document.getElementById('moomooPassword').value
            };

            debugLog('Form data: ' + JSON.stringify(formData));

            // Show success message
            showStatus('success', 'Configuration saved! (This is a test - credentials would be saved in real app)');

            return false;
        }

        // Show status messages
        function showStatus(type, message) {
            const statusDiv = document.getElementById('credentialsStatus');
            const successDiv = document.getElementById('credentialsSuccess');
            const errorDiv = document.getElementById('credentialsError');

            statusDiv.classList.remove('hidden');

            if (type === 'success') {
                successDiv.classList.remove('hidden');
                errorDiv.classList.add('hidden');
                document.getElementById('successMessage').textContent = message;
            } else {
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
                document.getElementById('errorMessage').textContent = message;
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            debugLog('Page loaded');
            debugLog('Settings button found: ' + !!document.getElementById('settingsBtn'));
            debugLog('Settings modal found: ' + !!document.getElementById('settingsModal'));

            // Try to get stored token
            const token = localStorage.getItem('auth_token');
            if (token) {
                debugLog('Auth token found: ' + token.substring(0, 20) + '...');
            } else {
                debugLog('No auth token found');
            }
        });
    </script>
</body>
</html>
