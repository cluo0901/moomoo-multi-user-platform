apiVersion: apps/v1
kind: Deployment
metadata:
  name: moomoo-platform
  namespace: moomoo-platform
  labels:
    app: moomoo-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moomoo-platform
  template:
    metadata:
      labels:
        app: moomoo-platform
    spec:
      containers:
      - name: moomoo-platform
        image: moomoo/platform:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: database-url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: jwt-secret
        - name: K8S_NAMESPACE
          value: "moomoo-users"
        - name: PLATFORM_API_URL
          value: "http://moomoo-platform.moomoo-platform.svc.cluster.local:5000"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: moomoo-platform
  namespace: moomoo-platform
spec:
  selector:
    app: moomoo-platform
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: moomoo-platform
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/moomoo_platform"
  jwt-secret: "your-super-secret-jwt-key-change-in-production"